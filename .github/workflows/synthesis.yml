name: Generic RTL synthesis
on: [push, pull_request, workflow_dispatch]
jobs:
  synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install synthesizer
        run: sudo apt-get update -qq && sudo apt-get install -y yosys
      - name: Synthesize secded_sram
        run: yosys -Q -T -p 'read_verilog -sv rtl/secded_sram.sv; hierarchy -check -top secded_sram; synth -top secded_sram; stat'
